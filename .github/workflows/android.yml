name: android apk
on:
  workflow_dispatch:
  push:
    paths: ["proto/**", "android/**", "sim/generator.json", "scripts/**", "package*.json", "capacitor.config.json", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: node proto/check.mjs
      - run: npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: glimmerwood-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
