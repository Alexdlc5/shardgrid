name: ios
# Simulator build on every relevant push (proves it compiles, no Apple account needed).
# Manual run with "upload" ticked: signed build straight to TestFlight via an App Store Connect API key.
# macOS minutes count 10x on private repos (~200 free macOS min/month): keep pushes batched.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["proto/**", "ios/**", "sim/generator.json", "scripts/**", "package*.json", "capacitor.config.json", ".github/workflows/ios.yml"]
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # explicit bash adds -o pipefail, so a failing xcodebuild | tail fails the step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Use the newest Xcode 26 (App Store Connect rejects older SDKs)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X" && xcodebuild -version
      - run: npm ci
      - run: node proto/check.mjs
      - run: npm run build && npx cap sync ios
      - name: Simulator build (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY_ID ISSUER KEY_P8; do [ -n "${!v}" ] || { echo "missing secret for $v (docs/SETUP.md, part A6)"; exit 1; }; done
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Glimmerwood.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive | tail -n 30
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Glimmerwood.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}" | tail -n 30
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }}: it appears in App Store Connect > TestFlight after processing (~10-30 min)."
