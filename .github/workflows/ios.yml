name: ios
# Simulator build on every relevant push (proves it compiles, no Apple account needed).
# Manual run with "upload" ticked: signed build straight to TestFlight via an App Store Connect API key.
# Tick "appstore" as well for the build you submit for review: it serves real ads (testAds false). Builds without it keep
# Google's test ads, and Options shows "· test ads" after the version so the two are easy to tell apart.
# macOS minutes count 10x on private repos (~200 free macOS min/month): keep pushes batched.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false
      appstore:
        description: "App Store build: real ads (tick upload too)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["proto/**", "ios/**", "sim/generator.json", "scripts/**", "package*.json", "capacitor.config.json", ".github/workflows/ios.yml"]
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # explicit bash adds -o pipefail, so a failing xcodebuild | tail fails the step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Use the newest Xcode 26 (App Store Connect rejects older SDKs)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X" && xcodebuild -version
      - run: npm ci
      - run: node proto/check.mjs && node scripts/check-save-mirror.mjs
      - run: python3 sim/test_sim.py
      - name: The build number must be new (Apple rejects a repeat)
        if: ${{ inputs.upload }}
        run: |
          B=$(tr -dc 0-9 < ios/BUILD); LAST=$(gh api repos/${{ github.repository }}/actions/workflows/ios.yml/runs --paginate -q '[.workflow_runs[] | select(.event=="workflow_dispatch" and .conclusion=="success") | .run_number] | max' 2>/dev/null || echo 0)
          echo "ios/BUILD=$B, highest run-number upload=$LAST"; [ "$B" -gt 111 ] || { echo "ios/BUILD must be greater than 111 (the last run-counter upload)"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      # The build number is ios/BUILD, a file in the repo (not the run counter): the release is a number we chose, and every
      # upload must be higher than the last Apple saw for this version (TestFlight holds up to 111). Bump it in the commit.
      - name: Read the build number
        id: ver
        run: echo "build=$(tr -dc 0-9 < ios/BUILD)" >> "$GITHUB_OUTPUT"
      - name: Build the web bundle (build ${{ steps.ver.outputs.build }}${{ inputs.appstore && ', real ads' || ', test ads' }})
        env:
          GW_BUILD: ${{ steps.ver.outputs.build }}
          GW_APPSTORE: ${{ inputs.appstore && '1' || '' }}
        run: |
          [ "$GW_APPSTORE" != 1 ] || [ "${{ inputs.upload }}" = true ] || { echo "appstore needs upload ticked too"; exit 1; }
          npm run build && npx cap sync ios
      - name: Simulator build (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY_ID ISSUER KEY_P8; do [ -n "${!v}" ] || { echo "missing secret for $v (docs/SETUP.md, part A6)"; exit 1; }; done
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          pip3 install --quiet --break-system-packages pyjwt cryptography
          KEY="$KEY" KEY_ID="$KEY_ID" ISSUER="$ISSUER" python3 scripts/revoke-ci-dev-certs.py
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Glimmerwood.xcarchive" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" "${AUTH[@]}" archive | tail -n 30
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Glimmerwood.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}" | tail -n 30
          rm -f "$KEY"
          # Crashlytics needs the dSYMs to turn crash addresses into file and line; a failed upload only warns
          "$RUNNER_TEMP/spm/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols" -gsp ios/App/App/GoogleService-Info.plist \
            -p ios "$RUNNER_TEMP/Glimmerwood.xcarchive/dSYMs" || echo "::warning::Crashlytics dSYM upload failed; crash reports stay unsymbolicated"
          echo "Uploaded build ${{ steps.ver.outputs.build }}: it appears in App Store Connect > TestFlight after processing (~10-30 min)."
